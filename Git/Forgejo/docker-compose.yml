services:
  server:
    image: codeberg.org/forgejo/forgejo:16
    container_name: forgejo
    environment:
      - USER_UID=${USER_UID}
      - USER_GID=${USER_GID}
      - FORGEJO__database__DB_TYPE=mysql
      - FORGEJO__database__HOST=mariadb
      - FORGEJO__database__NAME__FILE=/run/secrets/db_mysql_name
      - FORGEJO__database__USER__FILE=/run/secrets/db_mysql_user
      - FORGEJO__database__PASSWD__FILE=/run/secrets/db_mysql_password
      - FORGEJO__server__SSH_PORT=222
      # Canonical public URL, read from a secret file. Forgejo sits behind the
      # reverse proxy, so it must know it is served over https to generate
      # correct links (no http:// ones). No personal data in env vars.
      - FORGEJO__server__ROOT_URL__FILE=/run/secrets/root_url
      # Public instance: disable open registration. New users only via an admin.
      - FORGEJO__service__DISABLE_REGISTRATION=true
      # Shared Redis (Base/Database/Redis): sessions, cache, queue. DB 1 keeps
      # Forgejo's keys isolated from Nextcloud/Borg-UI (which use DB 0).
      - FORGEJO__session__PROVIDER=redis
      - FORGEJO__session__PROVIDER_CONFIG=redis://redis:6379/1
      - FORGEJO__cache__ADAPTER=redis
      - FORGEJO__cache__HOST=redis://redis:6379/1
      - FORGEJO__queue__TYPE=redis
      - FORGEJO__queue__CONN_STR=redis://redis:6379/1
      # GITEA__ compatibility prefix (recommended by Forgejo):
      - GITEA__database__DB_TYPE=mysql
      - GITEA__database__HOST=mariadb
      - GITEA__database__NAME__FILE=/run/secrets/db_mysql_name
      - GITEA__database__USER__FILE=/run/secrets/db_mysql_user
      - GITEA__database__PASSWD__FILE=/run/secrets/db_mysql_password
      - GITEA__server__SSH_PORT=222
      - GITEA__server__ROOT_URL__FILE=/run/secrets/root_url
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__session__PROVIDER=redis
      - GITEA__session__PROVIDER_CONFIG=redis://redis:6379/1
      - GITEA__cache__ADAPTER=redis
      - GITEA__cache__HOST=redis://redis:6379/1
      - GITEA__queue__TYPE=redis
      - GITEA__queue__CONN_STR=redis://redis:6379/1
    restart: always
    networks:
      - db-net
    volumes:
      - ${PATH_TO_CONTAINERS}/Forgejo:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    secrets:
      - db_mysql_name
      - db_mysql_user
      - db_mysql_password
      - root_url

secrets:
  db_mysql_name:
    file: "${PATH_TO_SECRETS}/Forgejo/db_mysql_name"
  db_mysql_user:
    file: "${PATH_TO_SECRETS}/Forgejo/db_mysql_user"
  db_mysql_password:
    file: "${PATH_TO_SECRETS}/Forgejo/db_mysql_password"
  root_url:
    file: "${PATH_TO_SECRETS}/Forgejo/root_url"

networks:
  db-net:
    external: true
    name: db-net
