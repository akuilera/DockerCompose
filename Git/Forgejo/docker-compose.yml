services:
  server:
    image: codeberg.org/forgejo/forgejo:16
    container_name: forgejo
    environment:
      - USER_UID=${USER_UID}
      - USER_GID=${USER_GID}
      - FORGEJO__database__DB_TYPE=mysql
      - FORGEJO__database__HOST=mariadb
      - FORGEJO__database__NAME__FILE=/run/secrets/db_mysql_name
      - FORGEJO__database__USER__FILE=/run/secrets/db_mysql_user
      - FORGEJO__database__PASSWD__FILE=/run/secrets/db_mysql_password
      - FORGEJO__server__SSH_PORT=222
      # GITEA__ compatibility prefix (recommended by Forgejo):
      - GITEA__database__DB_TYPE=mysql
      - GITEA__database__HOST=mariadb
      - GITEA__database__NAME__FILE=/run/secrets/db_mysql_name
      - GITEA__database__USER__FILE=/run/secrets/db_mysql_user
      - GITEA__database__PASSWD__FILE=/run/secrets/db_mysql_password
      - GITEA__server__SSH_PORT=222
    restart: always
    networks:
      - db-net
    volumes:
      - ${PATH_TO_CONTAINERS}/Forgejo:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    secrets:
      - db_mysql_name
      - db_mysql_user
      - db_mysql_password

secrets:
  db_mysql_name:
    file: "${PATH_TO_SECRETS}/Forgejo/db_mysql_name"
  db_mysql_user:
    file: "${PATH_TO_SECRETS}/Forgejo/db_mysql_user"
  db_mysql_password:
    file: "${PATH_TO_SECRETS}/Forgejo/db_mysql_password"

networks:
  db-net:
    external: true
    name: db-net
