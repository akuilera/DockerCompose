services:
  server:
    # image: docker.gitea.com/gitea:1.26.1
    image: docker.gitea.com/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=${USER_UID}
      - USER_GID=${USER_GID}
      - GITEA__database__DB_TYPE=mysql
      # - GITEA__database__HOST=db-net:3306
      - GITEA__database__HOST=mariadb
      - GITEA__database__NAME=${MYSQL_DATABASE}
      - GITEA__database__USER=${MYSQL_USER}
      - GITEA__database__PASSWD=${MYSQL_PASS}
      - GITEA__server__SSH_PORT=222
    restart: always
    networks:
      - db-net
    volumes:
      - ${PATH_TO_CONTAINERS}/Gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    # depends_on:
    #   - db

