services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      # Values are read from files (Docker secrets); they never enter environment.
      DOMAIN_FILE: /run/secrets/domain
      # Set SIGNUPS_ALLOWED to "true" if you want to create users.
      # Set it to "false" for safety
      # SIGNUPS_ALLOWED: "true"
      SIGNUPS_ALLOWED: "false"
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
      DATABASE_URL_FILE: /run/secrets/db_url
    volumes:
      - "${PATH_TO_CONTAINERS}/Vaultwarden/data:/data"
    secrets:
      - admin_token
      - db_url
      - domain
    networks:
      - db-net
      - proxy-net

secrets:
  admin_token:
    file: "${PATH_TO_SECRETS}/Vaultwarden/admin_token"
  db_url:
    file: "${PATH_TO_SECRETS}/Vaultwarden/db_url"
  domain:
    file: "${PATH_TO_SECRETS}/Vaultwarden/domain"

networks:
  db-net:
    external: true
    name: db-net
  proxy-net:
    external: true
    name: proxy-net
