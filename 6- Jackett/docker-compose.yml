services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Etc/UTC
      - AUTO_UPDATE=true #optional
      - RUN_OPTS= #optional
    volumes:
      - ${PATH_TO_CONTAINERS}/Jackett/data:/config
      - ${PATH_TO_MEDIA}:/downloads
    ports:
      - 9117:9117
    restart: unless-stopped
    networks:
      - media-download-net

networks:
  media-download-net:
    external: true