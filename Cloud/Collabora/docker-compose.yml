services:
  collabora:
    image: collabora/code
    container_name: collabora
    hostname: collabora
    restart: unless-stopped
    environment:
      - domain=${COLLABORA_DOMAIN}
      - username=admin
      - password=${COLLABORA_PASSWORD}
      - DONT_GEN_SSL_CERT=YES
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:logging.level=information
    # No healthcheck here on purpose: the image is distroless (no shell) and
    # ships its own HEALTHCHECK ("/usr/bin/coolwsd --probe" -> /livez). Defining
    # one in compose would override it and fail, because there is no /bin/sh.
    ports:
      - "9980:9980"
    networks:
      - nextcloud-net

networks:
  nextcloud-net:
    external: true
