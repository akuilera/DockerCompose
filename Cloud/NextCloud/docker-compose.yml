services:
# NextCloud - Private
  nextcloud:
    container_name: nextcloud
    hostname: nextcloud
    image: nextcloud:latest
    restart: always
    ports:
      - 8080:80
    # depends_on:
    #   - mariadb # Only works if Nextcloud and MariaDB are on the same YAML
    volumes:
      # - /ruta/local/data:/var/www/html/data
      # - /ruta/local/apps:/var/www/html/apps
      # - /ruta/local/config:/var/www/html/config
      # - ${PATH_TO_CLOUD_DATA}:/var/www/html
      - ${PATH_TO_CLOUD_DATA}/nextcloud_data:/var/www/html/data
      - ${PATH_TO_CONTAINERS}/Nextcloud/apps:/var/www/html/apps
      - ${PATH_TO_CONTAINERS}/Nextcloud/config:/var/www/html/config
      - ${PATH_TO_CONTAINERS}/Nextcloud/custom_apps:/var/www/html/custom_apps
      - ${PATH_TO_CONTAINERS}/Nextcloud/nextcloud_html:/var/www/html
    environment:
      - MYSQL_HOST=mariadb
      - MYSQL_DATABASE_FILE=/run/secrets/db_mysql_name
      - MYSQL_USER_FILE=/run/secrets/db_mysql_user
      - MYSQL_PASSWORD_FILE=/run/secrets/db_mysql_password
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS} # Domain Names or IPs (can also be private) separated with commas
      - REDIS_HOST=redis
      # - REDIS_HOST_PASSWORD=${REDIS_HOST_PASSWORD} # Optional in case you use another config
      # - OVERWRITECLIURL=${OVERWRITECLIURL} # ${NEXTCLOUD_TRUSTED_DOMAINS} with https://
      - OVERWRITEPROTOCOL=https
    secrets:
      - db_mysql_name
      - db_mysql_user
      - db_mysql_password
    networks:
      - db-net
      # - nextcloud-net
      - cloud-net
# Cron sidecar: runs /cron.sh (php cron.php every 5 min) so background jobs
# (files_antivirus BackgroundScanner, trashbin expiry, activity, ...) actually run.
# Shares the nextcloud_html volume: the image no longer bakes the app code into
# /var/www/html, the entrypoint rsyncs it there at startup, and the sidecar
# skips that entrypoint, so without the shared volume cron.php is missing.
  nextcloud-cron:
    container_name: nextcloud-cron
    image: nextcloud:latest
    restart: always
    entrypoint: /cron.sh
    volumes:
      - ${PATH_TO_CLOUD_DATA}/nextcloud_data:/var/www/html/data
      - ${PATH_TO_CONTAINERS}/Nextcloud/apps:/var/www/html/apps
      - ${PATH_TO_CONTAINERS}/Nextcloud/config:/var/www/html/config
      - ${PATH_TO_CONTAINERS}/Nextcloud/custom_apps:/var/www/html/custom_apps
      - ${PATH_TO_CONTAINERS}/Nextcloud/nextcloud_html:/var/www/html
    environment:
      - MYSQL_HOST=mariadb
      - MYSQL_DATABASE_FILE=/run/secrets/db_mysql_name
      - MYSQL_USER_FILE=/run/secrets/db_mysql_user
      - MYSQL_PASSWORD_FILE=/run/secrets/db_mysql_password
      - REDIS_HOST=redis
      - OVERWRITEPROTOCOL=https
    secrets:
      - db_mysql_name
      - db_mysql_user
      - db_mysql_password
    networks:
      - db-net
      # - nextcloud-net
      - cloud-net

secrets:
  db_mysql_name:
    file: "${PATH_TO_SECRETS}/NextCloud/db_mysql_name"
  db_mysql_user:
    file: "${PATH_TO_SECRETS}/NextCloud/db_mysql_user"
  db_mysql_password:
    file: "${PATH_TO_SECRETS}/NextCloud/db_mysql_password"

networks:
  db-net:
    external: true
  # nextcloud-net:
  #   external: true
  cloud-net:
    external: true