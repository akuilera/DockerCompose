services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    network_mode: host #optional
    environment:
      - PUID=1000 #optional
      - PGID=1000 #optional
      - TZ=Etc/UTC #optional
      - SUBDOMAINS=${DUCKDNS_DOMAIN}
      - TOKEN=${DUCKDNS_TOKEN}
      - UPDATE_IP=ipv4 # ${IPV4} optional
      - LOG_FILE=false # optional
    volumes:
      - ${PATH_TO_CONTAINERS}/DuckDNS/config:/config
    restart: unless-stopped
