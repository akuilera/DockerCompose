services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"  # Cambiado: accesible desde otros contenedores/NPM
    entrypoint:
      - /bin/sh
      - -c
      - |
        export N8N_HOST="$(cat /run/secrets/n8n_host)"
        export WEBHOOK_URL="https://$(cat /run/secrets/n8n_host)/"
        exec tini -- /docker-entrypoint.sh
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_PORT=5678
      - N8N_PROTOCOL=https  # NPM maneja HTTPS
      - N8N_PROXY_HOPS=1  # Añadido para proxies
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
    secrets:
      - n8n_host
    volumes:
      # - ${PATH_TO_CONTAINERS}/n8n:/home/node/.n8n
      - ${PATH_TO_CONTAINERS}/n8n/data:/home/node/.n8n
      - ${PATH_TO_CONTAINERS}/n8n/files:/files
    networks:
      - proxy-net

# volumes:
#   n8n_data:

secrets:
  n8n_host:
    file: "${PATH_TO_SECRETS}/n8n/n8n_host"

networks:
#   default:
#     name: proxy-net  # Usa la red de tu NPM existente
  proxy-net:
    external: true # NPM ya debe estar en esta red