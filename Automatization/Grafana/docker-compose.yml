# Grafana + MySQL (external `mariadb` on db-net) + per-device dashboards.
# First admin user & password: admin - admin
# Deploy/update via Portainer "Stack from Git" (folder Automatization/Grafana).
#
# A one-shot `bootstrap` service generates the provisioning files:
#   - datasource "Prometheus" (uid=prometheus) and the "Infrastructure"
#     provider are seeded only when missing/empty, so server-side edits survive;
#   - one dashboard per device is regenerated from the Devices/ registry on
#     every update (stale files are removed first).
#
# The scripts and the device registry are read from the cloned repository
# (an absolute path, so Portainer CE resolves the bind):
#   scripts   ${PATH_TO_COMPOSE}/Automatization/Grafana/scripts       -> /scripts
#   registry  ${PATH_TO_COMPOSE}/Automatization/Monitoring/Devices    -> /devices
#   output    ${PATH_TO_CONTAINERS}/Grafana/provisioning              -> /provisioning
services:
  bootstrap:
    image: python:3-alpine
    restart: "no"
    command: ["python3", "/scripts/bootstrap.py"]
    volumes:
      - ${PATH_TO_COMPOSE}/Automatization/Grafana/scripts:/scripts:ro
      - ${PATH_TO_COMPOSE}/Automatization/Monitoring/Devices:/devices:ro
      - ${PATH_TO_CONTAINERS}/Grafana/provisioning:/provisioning
    environment:
      - P=/provisioning
      - DEVICES=/devices

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    user: "472:472"  # grafana:grafana inside the container

    depends_on:
      bootstrap:
        condition: service_completed_successfully

    ports:
      - "3001:3000"

    volumes:
      - "${PATH_TO_CONTAINERS}/Grafana/data:/var/lib/grafana"
      - ${PATH_TO_CONTAINERS}/Grafana/provisioning:/etc/grafana/provisioning:ro

    environment:
      GF_DATABASE_TYPE: mysql
      GF_DATABASE_HOST: mariadb:3306
      GF_DATABASE_NAME__FILE: /run/secrets/grafana_db_name
      GF_DATABASE_USER__FILE: /run/secrets/grafana_db_user
      GF_DATABASE_PASSWORD__FILE: /run/secrets/grafana_db_password

    secrets:
      - source: grafana_db_name
        target: grafana_db_name
        mode: 0444
      - source: grafana_db_user
        target: grafana_db_user
        mode: 0444
      - source: grafana_db_password
        target: grafana_db_password
        mode: 0444

    networks:
      - db-net
      - monitoring-net

networks:
  db-net:
    external: true
  monitoring-net:
    external: true

secrets:
  grafana_db_name:
    file: ${PATH_TO_SECRETS}/Grafana/grafana_db_name
  grafana_db_user:
    file: ${PATH_TO_SECRETS}/Grafana/grafana_db_user
  grafana_db_password:
    file: ${PATH_TO_SECRETS}/Grafana/grafana_db_password