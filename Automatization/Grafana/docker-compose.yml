# Grafana + MySQL (external `mariadb` on db-net) + provisioning auto-seeded.
# First user & pass: admin - admin
# Deploy/update via Portainer "Stack from Git" (folder Automatization/Grafana).
# A one-shot `bootstrap` service writes the provisioning files (datasource
# "Prometheus" uid=prometheus, folder "Infrastructure" + dashboards) into
# ${PATH_TO_CONTAINERS}/Grafana/provisioning only if missing/empty, so nothing
# is read from the clone at runtime. Edit the seeded files on the server to
# customize (dashboard updates apply within ~30s).
services:
  bootstrap:
    image: busybox:1.36
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        
        echo "[bootstrap] dirs"
        mkdir -p "$$P/datasources" "$$P/dashboards"
        
        echo "[bootstrap] 1/4 datasource"
        if [ ! -s "$$P/datasources/prometheus.yml" ]; then
          printf '%s\n' \
            'apiVersion: 1' \
            '' \
            'datasources:' \
            '  - name: Prometheus' \
            '    uid: prometheus' \
            '    type: prometheus' \
            '    access: proxy' \
            '    url: http://prometheus:9090' \
            '    isDefault: true' \
            > "$$P/datasources/prometheus.yml"
          printf '%s' '    editable: false' >> "$$P/datasources/prometheus.yml"
        fi
        
        echo "[bootstrap] 2/4 provider"
        if [ ! -s "$$P/dashboards/dashboards.yml" ]; then
          printf '%s\n' \
            'apiVersion: 1' \
            '' \
            'providers:' \
            '  - name: "Infrastructure"' \
            '    orgId: 1' \
            '    folder: "Infrastructure"' \
            '    type: file' \
            '    disableDeletion: false' \
            '    updateIntervalSeconds: 30' \
            '    allowUiUpdates: false' \
            '    options:' \
            > "$$P/dashboards/dashboards.yml"
          printf '%s' '      path: /etc/grafana/provisioning/dashboards' >> "$$P/dashboards/dashboards.yml"
        fi
        
        echo "[bootstrap] 3/4 dashboards"
        if [ ! -s "$$P/dashboards/server-overview.json" ]; then
          printf '%s\n' \
            '{' \
            '  "annotations": {' \
            '    "list": [' \
            '      {' \
            '        "builtIn": 1,' \
            '        "datasource": { "type": "grafana", "uid": "-- Grafana --" },' \
            '        "enable": true,' \
            '        "hide": true,' \
            '        "iconColor": "rgba(0, 211, 255, 1)",' \
            '        "name": "Annotations & Alerts",' \
            '        "type": "dashboard"' \
            '      }' \
            '    ]' \
            '  },' \
            '  "editable": true,' \
            '  "graphTooltip": 1,' \
            '  "id": null,' \
            '  "links": [],' \
            '  "panels": [' \
            '    {' \
            '      "id": 1,' \
            '      "type": "stat",' \
            '      "title": "Uptime",' \
            '      "datasource": { "type": "prometheus", "uid": "prometheus" },' \
            '      "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },' \
            '      "targets": [' \
            '        {' \
            '          "refId": "A",' \
            '          "expr": "time() - node_boot_time_seconds{job=\"node\", host=\"$$host\"}",' \
            '          "legendFormat": "__auto",' \
            '          "range": false,' \
            '          "instant": true,' \
            '          "datasource": { "type": "prometheus", "uid": "prometheus" }' \
            '        }' \
            '      ],' \
            '      "fieldConfig": {' \
            '        "defaults": {' \
            '          "color": { "mode": "thresholds" },' \
            '          "mappings": [],' \
            '          "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },' \
            '          "unit": "dtdurations"' \
            '        },' \
            '        "overrides": []' \
            '      },' \
            '      "options": {' \
            '        "colorMode": "value",' \
            '        "graphMode": "none",' \
            '        "justifyMode": "auto",' \
            '        "orientation": "auto",' \
            '        "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },' \
            '        "textMode": "auto"' \
            '      }' \
            '    },' \
            '    {' \
            '      "id": 2,' \
            '      "type": "stat",' \
            '      "title": "Load (1/5/15)",' \
            '      "datasource": { "type": "prometheus", "uid": "prometheus" },' \
