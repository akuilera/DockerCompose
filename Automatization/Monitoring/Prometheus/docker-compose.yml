# Monitoring stack: Prometheus + Alertmanager + Node Exporter.
# Deploy/update via Portainer "Stack from Git". All config and data lives under
# ${PATH_TO_CONTAINERS}; scripts and the device registry are read from the
# repository clone at ${PATH_TO_COMPOSE}.
#   tmpl    = templates (regenerated only if missing; edit them to restore)
#   config  = files Prometheus/Alertmanager actually read (edit -> HUP)
#   data    = writable runtime data (owner 65534 = nobody)
# Add devices by creating one Devices/<device>/.env in the clone (the registry
# is mounted read-only at /devices). The bootstrap turns each file into a target
# with labels.host=DEVICE_NAME; the Grafana dashboards filter on host="$host".
# An empty or missing registry aborts the bootstrap with a pointer to the repo
# template (Automatization/Monitoring/Devices.example/).

services:
  bootstrap:
    image: busybox:1.36
    restart: "no"
    # The script is a real file in the repository clone, mounted read-only at
    # /scripts, instead of an inline multi-line command. An inline command
    # forced the whole script into a string wrapped in /bin/sh -c '...', and any
    # apostrophe in the rules -- the PSI series is literally named "full" --
    # closed that quote early and made Compose reject the stack with
    # "services[bootstrap].command invalid command line string". The templates
    # are copied from the clone (mounted read-only) instead of being generated
    # with printf here, so rules/alerts.yml lives in exactly one place.
    command: ["/bin/sh", "/scripts/bootstrap.sh"]
    volumes:
      # Script and seed templates, read from the repository clone at
      # ${PATH_TO_COMPOSE} (never from the container data root).
      - ${PATH_TO_COMPOSE}/Automatization/Monitoring/Prometheus/scripts:/scripts:ro
      - ${PATH_TO_COMPOSE}/Automatization/Monitoring/Prometheus/prometheus:/seed-prometheus:ro
      - ${PATH_TO_COMPOSE}/Automatization/Monitoring/Prometheus/alertmanager:/seed-alertmanager:ro
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/tmpl:/tmpl
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/config:/config-prometheus
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/data:/prom-data
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/tmpl:/tmpl-alertmanager
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/config:/config-alertmanager
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/data:/alert-data
      # Device registry, read from the repository clone (not from the container
      # data root): one <device>/.env per host. The whole Devices/ folder is
      # gitignored; the committed reference is Devices.example/.
      - ${PATH_TO_COMPOSE}/Automatization/Monitoring/Devices:/devices:ro
    environment:
      - TMPL=/tmpl
      - C_PROM=/config-prometheus
      - TMPL_ALERT=/tmpl-alertmanager
      - C_ALERT=/config-alertmanager
      - DATA=/prom-data
      - ALERTDATA=/alert-data

  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: prometheus
    restart: always
    user: "65534:65534"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Both limits are enforced and whichever is reached first wins, so
      # retention.size is what actually decides how much history survives.
      # At a 15s scrape interval, 30 days is ~173k samples per series and 15GB
      # covers roughly 22k-32k series. Check numSeries(prometheus_tsdb_head_series)
      # under Status -> TSDB before adding targets, and raise this if you get
      # close: a silently shortened history is worse than a known limit.
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=15GB
      - --web.enable-lifecycle
    volumes:
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/config:/etc/prometheus:ro
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/data:/prometheus
    networks:
      - monitoring-net

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: always
    user: "65534:65534"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/data
    volumes:
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/config:/etc/alertmanager:ro
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/data:/data
    networks:
      - monitoring-net

networks:
  monitoring-net:
    external: true
