# Monitoring stack: Prometheus + Alertmanager + Node Exporter.
# Deploy/update via Portainer "Stack from Git". All config and data lives under
# ${PATH_TO_CONTAINERS}; nothing is read from the clone at runtime.
#   tmpl    = templates (regenerated only if missing; edit them to restore)
#   config  = files Prometheus/Alertmanager actually read (edit -> HUP)
#   data    = writable runtime data (owner 65534 = nobody)
# Add devices by editing NODE_TARGETS (comma-separated name=host:port) -> Update.
#   The "name=" prefix is what sets labels.host=<name> on the target; the Grafana
#   dashboards filter on host="$host", so a target without it renders "No data".

services:
  bootstrap:
    image: busybox:1.36
    restart: "no"
    command: |
      /bin/sh -c '
      set -eu

      echo "[bootstrap] 1/5 dirs"
      mkdir -p "$$TMPL/rules" "$$TMPL/targets" \
               "$$C_PROM/rules" "$$C_PROM/targets" \
               "$$TMPL_ALERT" "$$C_ALERT" \
               "$$DATA" "$$ALERTDATA"

      echo "[bootstrap] 2/5 templates"
      if [ ! -s "$$TMPL/prometheus.yml" ]; then
        printf "%s\n" \
          "global:" \
          "  scrape_interval: 15s" \
          "  evaluation_interval: 30s" \
          "  scrape_timeout: 10s" \
          "rule_files:" \
          "  - /etc/prometheus/rules/alerts.yml" \
          "scrape_configs:" \
          "  - job_name: prometheus" \
          "    static_configs:" \
          "      - targets: [\"localhost:9090\"]" \
          "  - job_name: node" \
          "    file_sd_configs:" \
          "      - files: [\"/etc/prometheus/targets/nodes.yml\"]" \
          "        refresh_interval: 30s" \
          > "$$TMPL/prometheus.yml"
      fi
      if [ ! -s "$$TMPL/rules/alerts.yml" ]; then
        printf "%s\n" \
          "# Seeded by the bootstrap in docker-compose.yml -- this is the live file." \
          "# Edit ../prometheus/rules/alerts.yml in the repo and re-run the sync, or" \
          "# edit this file on the server directly and reload Prometheus with:" \
          "#   docker kill -s HUP prometheus" \
          "" \
          "groups:" \
          "  - name: infrastructure" \
          "    rules:" \
          "      - alert: HostDown" \
          "        expr: up{job=\"node\"} == 0" \
          "        for: 5m" \
          "        labels:" \
          "          severity: critical" \
          "        annotations:" \
          "          summary: \"{{ \$$labels.host }} is not reachable\"" \
          "          description: \"No successful scrape for 5 minutes. This is what a hard freeze looks like from Prometheus: the box stops answering entirely, so nothing on it can report anything.\"" \
          "" \
          "      - alert: HostDownBrief" \
          "        expr: up{job=\"node\"} == 0" \
          "        for: 3m" \
          "        labels:" \
          "          severity: warning" \
          "        annotations:" \
          "          summary: \"{{ \$$labels.host }} stopped answering (3m)\"" \
          "          description: \"Early warning before HostDown fires. If the machine comes back on its own, check node_gpu_heartbeat_max_gap_seconds for the actual outage length.\"" \
          "" \
          "      - alert: HostRebooted" \
          "        expr: node_time_seconds{job=\"node\"} - node_boot_time_seconds{job=\"node\"} < 300" \
          "        for: 1m" \
          "        labels:" \
          "          severity: info" \
          "        annotations:" \
          "          summary: \"{{ \$$labels.host }} rebooted in the last 5 minutes\"" \
          "          description: \"Uptime is under 5 minutes. If node_gpu_heartbeat_max_gap_seconds is also large, the reboot followed a freeze rather than being requested.\"" \
          "" \
          "      - alert: HighCpuUsage" \
          "        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job=\"node\", mode=\"idle\"}[5m])) * 100) > 90" \
          "        for: 10m" \
          "        labels:" \
          "          severity: warning" \
          "        annotations:" \
          "          summary: \"High CPU on {{ \$$labels.host }} ({{ \$$labels.instance }})\"" \
          "" \
          "      - alert: HighMemoryUsage" \
          "        expr: 100 * (1 - node_memory_MemAvailable_bytes{job=\"node\"} / node_memory_MemTotal_bytes{job=\"node\"}) > 90" \
          "        for: 10m" \
          "        labels:" \
          "          severity: warning" \
          "        annotations:" \
          "          summary: \"High memory on {{ \$$labels.host }} ({{ \$$labels.instance }})\"" \
          "" \
          "      - alert: FilesystemAlmostFull" \
          "        expr: (1 - node_filesystem_avail_bytes{job=\"node\", fstype!~\"tmpfs|overlay|cgroup.*|proc|sysfs|devpts|fuse.*|squashfs|autofs\"} / node_filesystem_size_bytes{job=\"node\", fstype!~\"tmpfs|overlay|cgroup.*|proc|sysfs|devpts|fuse.*|squashfs|autofs\"}) * 100 >= 95" \
          "        for: 10m" \
          "        labels:" \
          "          severity: warning" \
          "        annotations:" \
          "          summary: \"Filesystem almost full on {{ \$$labels.mountpoint }} ({{ \$$labels.host }})\"" \
          "" \
          "      - alert: DiskFillPredicted" \
          "        expr: predict_linear(node_filesystem_avail_bytes{job=\"node\", fstype!~\"tmpfs|overlay|cgroup.*|proc|sysfs|devpts|fuse.*|squashfs|autofs\"}[6h], 24*3600) < 0" \
          "        for: 30m" \
          "        labels:" \
          "          severity: warning" \
          "        annotations:" \
          "          summary: \"Disk {{ \$$labels.mountpoint }} on {{ \$$labels.host }} will fill within 24h\"" \
          "" \
          "      - alert: DiskBusy" \
          "        expr: rate(node_disk_io_time_seconds_total{job=\"node\", device!~\"^(loop|ram|fd)[0-9]*\$$\"}[5m]) > 0.95" \
          "        for: 10m" \
          "        labels:" \
          "          severity: warning" \
          "        annotations:" \
          "          summary: \"Disk {{ \$$labels.device }} on {{ \$$labels.host }} is over 95% busy\"" \
          "          description: \"Sustained saturation for 10 minutes. A failing drive re-reading the same bad blocks looks exactly like this, and a spinning disk at 100% is one of the symptoms of the freeze.\"" \
          "" \
          "      - alert: NvmeMediaErrors" \
          "        expr: increase(node_nvme_media_errors_total{job=\"node\"}[1h]) > 0" \
          "        labels:" \
          "          severity: warning" \
          "        annotations:" \
          "          summary: \"NVMe media errors on {{ \$$labels.device }} ({{ \$$labels.host }})\"" \
          "          description: \"The drive is reporting uncorrectable or corrected media errors. This is hardware, not a driver, and it does not go away on its own.\"" \
          "" \
          "      - alert: NodeExporterCollectorFailing" \
          "        expr: node_scrape_collector_success{job=\"node\", collector=~\"^(boot_time|cpu|diskstats|filesystem|hwmon|loadavg|meminfo|swap|systemd|textfile|time|uname)\$$\"} == 0" \
          "        for: 15m" \
          "        labels:" \
          "          severity: warning" \
          "        annotations:" \
          "          summary: \"node_exporter collector {{ \$$labels.collector }} failing on {{ \$$labels.host }}\"" \
          "          description: \"A collector that normally works has been failing for 15 minutes, so metrics are silently missing even though the target is up.\"" \
          "" \
          "  - name: thermal" \
          "    rules:" \
          "      - alert: HighGpuTemperature" \
          "        expr: node_gpu_temperature_celsius{job=\"node\"} > 85" \
          "        for: 10m" \
          "        labels:" \
          "          severity: warning" \
          "        annotations:" \
          "          summary: \"GPU {{ \$$labels.gpu }} on {{ \$$labels.host }} is at {{ \$$value }} C\"" \
          "          description: \"Above 85 C for 10 minutes on a laptop GPU. Check GpuHardwareThrottle at the same time, and check whether something is holding the dGPU awake.\"" \
          "" \
          "      - alert: HighGpuTemperatureCritical" \
          "        expr: node_gpu_temperature_celsius{job=\"node\"} > 92" \
          "        labels:" \
          "          severity: critical" \
          "        annotations:" \
          "          summary: \"GPU {{ \$$labels.gpu }} on {{ \$$labels.host }} is at {{ \$$value }} C\"" \
          "          description: \"At or past the thermal target. A laptop GPU that stays here will drop clocks and can thermal-trip the whole machine.\"" \
          "" \
          "      - alert: GpuHardwareThrottle" \
          "        expr: node_gpu_throttle_reason_active{job=\"node\", reason=~\"hw_slowdown|hw_thermal_slowdown|hw_power_brake_slowdown\"} == 1" \
          "        for: 5m" \
          "        labels:" \
          "          severity: warning" \
          "        annotations:" \
          "          summary: \"GPU {{ \$$labels.gpu }} on {{ \$$labels.host }} is hardware throttling ({{ \$$labels.reason }})\"" \
          "          description: \"A hardware-level throttle is asserted. This is the GPU protecting itself from heat or power, and it is worth correlating with any freeze.\"" \
          "" \
          "      - alert: HighSystemTemperature" \
          "        expr: max by (instance) (node_hwmon_temp_celsius{job=\"node\"}) > 90" \
          "        for: 10m" \
          "        labels:" \
          "          severity: warning" \
          "        annotations:" \
          "          summary: \"A sensor on {{ \$$labels.instance }} is at {{ \$$value }} C\"" \
          "          description: \"Highest of all hwmon sensors: CPU, NVMe or GPU. Sensors that do not report a reading are absent from this metric rather than reported as zero, so this only fires on real readings.\"" \
          "" \
          "  - name: gpu" \
          "    rules:" \
          "      - alert: GpuQueryFailed" \
          "        expr: node_gpu_query_success{job=\"node\"} == 0" \
          "        for: 2m" \
          "        labels:" \
          "          severity: warning" \
          "        annotations:" \
          "          summary: \"nvidia-smi is not answering on {{ \$$labels.host }}\"" \
          "          description: \"The GPU heartbeat could not query nvidia-smi within its timeout. A hung nvidia-smi is a known failure mode on this class of laptop and can precede a full freeze.\"" \
          "" \
          "      - alert: GpuHeartbeatStale" \
          "        expr: time() - node_gpu_last_query_timestamp_seconds{job=\"node\"} > 120" \
          "        for: 2m" \
          "        labels:" \
          "          severity: warning" \
          "        annotations:" \
          "          summary: \"GPU heartbeat is stale on {{ \$$labels.host }}\"" \
          "          description: \"The exporter is still answering, but the GPU heartbeat file has not been refreshed for over 2 minutes, so the GPU is wedged while the rest of the machine is up.\"" \
          "" \
          "      - alert: GpuFreezeDetected" \
          "        expr: node_gpu_heartbeat_max_gap_seconds{job=\"node\"} > 300" \
          "        labels:" \
          "          severity: warning" \
          "        annotations:" \
          "          summary: \"Hard freeze recorded on {{ \$$labels.host }}: heartbeat was interrupted for {{ \$$value | humanizeDuration }}\"" \
          "          description: \"Latched by the heartbeat and the only hard-freeze evidence that reaches Prometheus, because the box is by definition down while a freeze happens. It survives reboots for 30 days; once you have finished investigating, clear it by removing the file /var/lib/node_exporter/textfile_collector/nvidia_gpu.maxgap\"" \
          > "$$TMPL/rules/alerts.yml"
      fi
      if [ ! -s "$$TMPL_ALERT/alertmanager.yml" ]; then
        printf "%s\n" \
          "global:" \
          "  resolve_timeout: 5m" \
          "route:" \
          "  group_by: [alertname]" \
          "  group_wait: 30s" \
          "  group_interval: 5m" \
          "  repeat_interval: 4h" \
          "  receiver: default" \
          "receivers:" \
          "  - name: default" \
          > "$$TMPL_ALERT/alertmanager.yml"
      fi

      echo "[bootstrap] 3/5 config"
      for f in prometheus.yml rules/alerts.yml; do
        [ -e "$$C_PROM/$$f" ] || cp "$$TMPL/$$f" "$$C_PROM/$$f"
      done
      [ -e "$$C_ALERT/alertmanager.yml" ] || cp "$$TMPL_ALERT/alertmanager.yml" "$$C_ALERT/alertmanager.yml"

      echo "[bootstrap] 4/5 nodes.yml (regenerado siempre desde NODE_TARGETS)"
      : > "$$C_PROM/targets/nodes.yml"
      printf "%s\n" "$$NODE_TARGETS" | tr "," "\n" | while IFS= read -r t; do
        [ -n "$$t" ] || continue
        case "$$t" in
          *=*)
            name="$${t%%=*}"; addr="$${t##*=}"
            [ -n "$$addr" ] || continue
            printf "%s\n" \
              "- targets:" \
              "    - $$addr" \
              "  labels:" \
              "    host: $$name" \
              >> "$$C_PROM/targets/nodes.yml"
            ;;
          *)
            printf "%s\n" \
              "- targets:" \
              "    - $$t" \
              >> "$$C_PROM/targets/nodes.yml"
            ;;
        esac
      done

      echo "[bootstrap] 5/5 validar nodes.yml"
      n_blocks=$$(grep -c "^[[:space:]]*-[[:space:]]targets:[[:space:]]*$$" "$$C_PROM/targets/nodes.yml" || true)
      n_items=$$(grep -c "^[[:space:]]*-[[:space:]]" "$$C_PROM/targets/nodes.yml" || true)
      if [ "$$n_blocks" -eq 0 ]; then
        echo "[bootstrap] ERROR: nodes.yml sin targets (revisa NODE_TARGETS)"
        exit 1
      fi
      if [ "$$n_items" -ne $$((n_blocks * 2)) ]; then
        echo "[bootstrap] ERROR: nodes.yml malformado ($$n_items items para $$n_blocks bloques);"
        echo "[bootstrap]        Prometheus no podria leerlo y todos los paneles quedarian vacios."
        exit 1
      fi
      echo "[bootstrap] nodes.yml OK: $$n_blocks target(s)"

      chown -R 65534:65534 "$$DATA" "$$ALERTDATA"
      echo "[bootstrap] done"'
    volumes:
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/tmpl:/tmpl
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/config:/config-prometheus
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/data:/prom-data
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/tmpl:/tmpl-alertmanager
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/config:/config-alertmanager
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/data:/alert-data
    environment:
      - TMPL=/tmpl
      - C_PROM=/config-prometheus
      - TMPL_ALERT=/tmpl-alertmanager
      - C_ALERT=/config-alertmanager
      - DATA=/prom-data
      - ALERTDATA=/alert-data
      - NODE_TARGETS=${NODE_TARGETS:-server=node-exporter:9100}

  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: prometheus
    restart: always
    user: "65534:65534"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Both limits are enforced and whichever is reached first wins, so
      # retention.size is what actually decides how much history survives.
      # At a 15s scrape interval, 20GB covers ~90 days for roughly 10k-14k
      # series. Check numSeries(prometheus_tsdb_head_series) under
      # Status -> TSDB before adding targets, and raise this if you get close:
      # a silently shortened history is worse than a known limit.
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=20GB
      - --web.enable-lifecycle
    volumes:
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/config:/etc/prometheus:ro
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/data:/prometheus
    networks:
      - monitoring-net

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: always
    user: "65534:65534"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/data
    volumes:
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/config:/etc/alertmanager:ro
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/data:/data
    networks:
      - monitoring-net

  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: node-exporter
    restart: always
    user: "0:0"
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.processes
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring-net

networks:
  monitoring-net:
    external: true
