# Monitoring stack: Prometheus + Alertmanager + Node Exporter.
# Deploy/update via Portainer "Stack from Git". All config and data lives under
# ${PATH_TO_CONTAINERS}; nothing is read from the clone at runtime.
#   tmpl    = templates (regenerated only if missing; edit them to restore)
#   config  = files Prometheus/Alertmanager actually read (edit -> HUP)
#   data    = writable runtime data (owner 65534 = nobody)
# Add devices by editing NODE_TARGETS (comma-separated name=host:port) -> Update.
#   The "name=" prefix is what sets labels.host=<name> on the target; the Grafana
#   dashboards filter on host="$host", so a target without it renders "No data".

services:
  bootstrap:
    image: busybox:1.36
    restart: "no"
    command: |
      /bin/sh -c '
      set -eu

      echo "[bootstrap] 1/5 dirs"
      mkdir -p "$$TMPL/rules" "$$TMPL/targets" \
               "$$C_PROM/rules" "$$C_PROM/targets" \
               "$$TMPL_ALERT" "$$C_ALERT" \
               "$$DATA" "$$ALERTDATA"

      echo "[bootstrap] 2/5 templates"
      if [ ! -s "$$TMPL/prometheus.yml" ]; then
        printf "%s\n" \
          "global:" \
          "  scrape_interval: 15s" \
          "  evaluation_interval: 30s" \
          "  scrape_timeout: 10s" \
          "rule_files:" \
          "  - /etc/prometheus/rules/alerts.yml" \
          "scrape_configs:" \
          "  - job_name: prometheus" \
          "    static_configs:" \
          "      - targets: [\"localhost:9090\"]" \
          "  - job_name: node" \
          "    file_sd_configs:" \
          "      - files: [\"/etc/prometheus/targets/nodes.yml\"]" \
          "        refresh_interval: 30s" \
          > "$$TMPL/prometheus.yml"
      fi
      if [ ! -s "$$TMPL/rules/alerts.yml" ]; then
        printf "%s\n" "groups: []" > "$$TMPL/rules/alerts.yml"
      fi
      if [ ! -s "$$TMPL_ALERT/alertmanager.yml" ]; then
        printf "%s\n" \
          "global:" \
          "  resolve_timeout: 5m" \
          "route:" \
          "  group_by: [alertname]" \
          "  group_wait: 30s" \
          "  group_interval: 5m" \
          "  repeat_interval: 4h" \
          "  receiver: default" \
          "receivers:" \
          "  - name: default" \
          > "$$TMPL_ALERT/alertmanager.yml"
      fi

      echo "[bootstrap] 3/5 config"
      for f in prometheus.yml rules/alerts.yml; do
        [ -e "$$C_PROM/$$f" ] || cp "$$TMPL/$$f" "$$C_PROM/$$f"
      done
      [ -e "$$C_ALERT/alertmanager.yml" ] || cp "$$TMPL_ALERT/alertmanager.yml" "$$C_ALERT/alertmanager.yml"

      echo "[bootstrap] 4/5 nodes.yml (regenerado siempre desde NODE_TARGETS)"
      : > "$$C_PROM/targets/nodes.yml"
      printf "%s\n" "$$NODE_TARGETS" | tr "," "\n" | while IFS= read -r t; do
        [ -n "$$t" ] || continue
        case "$$t" in
          *=*)
            name="$${t%%=*}"; addr="$${t##*=}"
            [ -n "$$addr" ] || continue
            printf "%s\n" \
              "- targets:" \
              "    - $$addr" \
              "  labels:" \
              "    host: $$name" \
              >> "$$C_PROM/targets/nodes.yml"
            ;;
          *)
            printf "%s\n" \
              "- targets:" \
              "    - $$t" \
              >> "$$C_PROM/targets/nodes.yml"
            ;;
        esac
      done

      echo "[bootstrap] 5/5 validar nodes.yml"
      n_blocks=$$(grep -c "^[[:space:]]*-[[:space:]]targets:[[:space:]]*$$" "$$C_PROM/targets/nodes.yml" || true)
      n_items=$$(grep -c "^[[:space:]]*-[[:space:]]" "$$C_PROM/targets/nodes.yml" || true)
      if [ "$$n_blocks" -eq 0 ]; then
        echo "[bootstrap] ERROR: nodes.yml sin targets (revisa NODE_TARGETS)"
        exit 1
      fi
      if [ "$$n_items" -ne $$((n_blocks * 2)) ]; then
        echo "[bootstrap] ERROR: nodes.yml malformado ($$n_items items para $$n_blocks bloques);"
        echo "[bootstrap]        Prometheus no podria leerlo y todos los paneles quedarian vacios."
        exit 1
      fi
      echo "[bootstrap] nodes.yml OK: $$n_blocks target(s)"

      chown -R 65534:65534 "$$DATA" "$$ALERTDATA"
      echo "[bootstrap] done"'
    volumes:
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/tmpl:/tmpl
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/config:/config-prometheus
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/data:/prom-data
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/tmpl:/tmpl-alertmanager
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/config:/config-alertmanager
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/data:/alert-data
    environment:
      - TMPL=/tmpl
      - C_PROM=/config-prometheus
      - TMPL_ALERT=/tmpl-alertmanager
      - C_ALERT=/config-alertmanager
      - DATA=/prom-data
      - ALERTDATA=/alert-data
      - NODE_TARGETS=${NODE_TARGETS:-server=node-exporter:9100}

  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: prometheus
    restart: always
    user: "65534:65534"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-lifecycle
    volumes:
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/config:/etc/prometheus:ro
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/prometheus/data:/prometheus
    networks:
      - monitoring-net

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: always
    user: "65534:65534"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/data
    volumes:
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/config:/etc/alertmanager:ro
      - ${PATH_TO_CONTAINERS}/Monitoring/Prometheus/alertmanager/data:/data
    networks:
      - monitoring-net

  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: node-exporter
    restart: always
    user: "0:0"
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.processes
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring-net

networks:
  monitoring-net:
    external: true
