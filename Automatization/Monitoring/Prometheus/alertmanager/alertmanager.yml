global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "host"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"

receivers:
  - name: "default"

# Optional Telegram notifications (enable later):
