services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    command:
      - tunnel
      - --no-autoupdate
      - run
    secrets:
      - tunnel_token
    networks:
      - proxy-net # Connected to the same net as nginx-proxy-manager

networks:
  proxy-net:
    external: true

secrets:
  tunnel_token:
    file: "${PATH_TO_SECRETS}/Cloudflare/tunnel_token"
