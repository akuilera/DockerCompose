services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    restart: unless-stopped
    environment:
      # The Web UI is served over HTTP (51821 / NPM upstream); v15 refuses to
      # serve it unless INSECURE=true. Remove once HTTPS terminates on the
      # container itself.
      - INSECURE=true
      # IPv4-only homelab (vpn-net has no IPv6): skip the IPv6 defaults.
      - DISABLE_IPV6=true
    volumes:
      - ${PATH_TO_CONTAINERS}/WireGuard/.wg-easy:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      vpn-net:
        ipv4_address: 10.8.1.2

networks:
  vpn-net:
    external: true
