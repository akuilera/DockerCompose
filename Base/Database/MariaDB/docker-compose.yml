services:
  mariadb:
    container_name: mariadb
    image: mariadb:12
    restart: always
    # command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    # The root password is read from a file (Docker secret); it never enters
    # the environment. Note: on an existing data directory the image ignores
    # MYSQL_ROOT_PASSWORD_FILE at runtime (it only applies on first bootstrap),
    # so a rotation is done via SQL over the socket, see Database/README.md.
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    volumes:
      - ${PATH_TO_CONTAINERS}/MariaDB/data:/var/lib/mysql
      - ${PATH_TO_CONTAINERS}/MariaDB/my_custom.cnf:/etc/mysql/conf.d/my_custom.cnf
    networks:
      - db-net
    ports:
      - "3306:3306"
    secrets:
      - mysql_root_password
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh --connect --innodb_initialized"]
      start_period: 40s
      interval: 30s
      timeout: 10s
      retries: 5

  # redis:
  #   container_name: redis
  #   image: redis:alpine
  #   restart: always
  #   networks:
  #     - db-net

secrets:
  mysql_root_password:
    file: "${PATH_TO_SECRETS}/MariaDB/mysql_root_password"

# volumes:
#   mariadb-data:

networks:
  db-net:
    # driver: bridge
    name: db-net
    external: true