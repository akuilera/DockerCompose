services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Etc/UTC
      - TRANSMISSION_WEB_HOME= #optional
      - USER=admin
      - PASS=${PASSWORD}
      - WHITELIST= #optional
      - PEERPORT= #optional
      - HOST_WHITELIST= #optional
    volumes:
      - ${PATH_TO_CONTAINERS}/Transmission/data:/config
      - ${PATH_TO_MEDIA}:/downloads
      # - /path/to/watch/folder:/watch #optional
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
    networks:
      - media-download-net

networks:
  media-download-net:
    external: true
