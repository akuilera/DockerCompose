services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # - JELLYFIN_PublishedServerUrl=http://<host-ip> #optional
    volumes:
      - ${PATH_TO_CONTAINERS}/Containers/Jellyfin/library:/config
      - ${PATH_TO_MEDIA}/series:/data/shows
      - ${PATH_TO_MEDIA}/movies:/data/movies
    ports:
      - 8096:8096
      # - 8920:8920 #optional
      # - 7359:7359/udp #optional
      # - 1900:1900/udp #optional
    restart: unless-stopped
