services:
  emby:
    image: lscr.io/linuxserver/emby:latest
    container_name: emby
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Etc/UTC
    volumes:
      - ${PATH_TO_CONTAINERS}/Emby/library:/config
      # - ${PATH_TO_MEDIA}/Series:/data/tvshows
      - ${PATH_TO_MEDIA}/complete:/data/movies
      - /opt/vc/lib:/opt/vc/lib #optional
    ports:
      - 8096:8096
      - 8920:8920 #optional
    restart: unless-stopped
    networks:
      - media-download-net

networks:
  media-download-net:
    external: true